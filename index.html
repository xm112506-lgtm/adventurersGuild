<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冒險者公會</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#55FF55;--b:#3B82F6;--y:#FFAA00;--r:#FF3B30;--d:#1b1b1b;--s:#3a3a3a;--p:#c6c6c6}
*{box-sizing:border-box}
body{margin:0;font-family:'DotGothic16','Noto Sans TC',monospace;background:#2b2118 repeating-linear-gradient(0deg,#2b2118 0 32px,#33271c 32px 64px);color:#fff;min-height:100vh}
.wrap{max-width:1200px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--s);border:4px solid #000;box-shadow:inset 4px 4px 0 #6b6b6b,inset -4px -4px 0 #222;padding:10px 14px;margin-bottom:14px}
h1{margin:0;font-size:24px;color:var(--y);text-shadow:3px 3px 0 #000}
h2{color:var(--g);text-shadow:2px 2px 0 #000;margin:6px 0}
.btn{font:inherit;cursor:pointer;color:#fff;background:#6b6b6b;border:3px solid #000;box-shadow:inset 3px 3px 0 #9a9a9a,inset -3px -3px 0 #3d3d3d;padding:6px 12px;position:relative;margin:2px}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translate(2px,2px)}
.g{background:#2f9e2f;box-shadow:inset 3px 3px 0 #7dff7d,inset -3px -3px 0 #1c6b1c}
.bl{background:var(--b);box-shadow:inset 3px 3px 0 #8bb6ff,inset -3px -3px 0 #1d4ea8}
.y{background:#d98a00;box-shadow:inset 3px 3px 0 #ffd070,inset -3px -3px 0 #8a5600}
.rd{background:#c62828;box-shadow:inset 3px 3px 0 #ff8a80,inset -3px -3px 0 #7a1010}
.dot{position:absolute;top:-6px;right:-6px;width:14px;height:14px;background:var(--r);border:2px solid #000}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--s);border:4px solid #000;box-shadow:inset 4px 4px 0 #6b6b6b,inset -4px -4px 0 #222;padding:14px;text-align:center}
.av{font-size:56px;background:#222;border:4px solid #000;display:inline-block;width:92px;height:92px;line-height:84px}
.bar{height:18px;background:#111;border:3px solid #000;margin:6px 0;position:relative}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--g) 0 8px,#3acb3a 8px 16px)}
.bar.b i{background:var(--b)}
.box{background:#2a2a2a;border:3px solid #000;padding:10px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:#222;border:3px solid #000;padding:10px;text-align:center}.stat b{display:block;font-size:28px;color:var(--y)}
.tabs{display:flex;flex-wrap:wrap;margin-bottom:8px}
input,select,textarea{font:inherit;background:#111;color:#fff;border:3px solid #000;padding:5px;margin:2px;max-width:100%}
table{border-collapse:collapse;width:100%}td,th{border:2px solid #000;padding:5px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:#222;border:3px solid #000;min-height:64px;padding:4px;cursor:pointer;font-size:13px}
.day.off{opacity:.45}.day.clr{border-color:var(--g)}.day.today{border-color:var(--y)}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:10px}
.md{background:var(--s);border:4px solid #000;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#222;border:3px solid #000;padding:6px 8px;margin:4px 0;text-align:left}
.done{border-color:var(--g)}.mut{color:#aaa;font-size:13px}
.og{background:#ff7a00!important;box-shadow:inset 3px 3px 0 #ffc27a,inset -3px -3px 0 #a14d00!important}.na{opacity:.4}.btn small{font-size:11px}body.cute{--y:#d9780f;--g:#13986a;--r:#e5484d;background:#fff3c4 radial-gradient(circle at 15% 8%,#ffe08a 0,transparent 38%) fixed;font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif;color:#2b3a55}
.cute header,.cute .card,.cute .box,.cute .md,.cute .row,.cute .stat,.cute .day{background:#fffdf5;border:3px solid #2b4a7a;border-radius:18px;box-shadow:0 4px 0 #2b4a7a;color:#2b3a55}
.cute .box .box,.cute .row{box-shadow:none}.cute h1{color:#e8704f;text-shadow:none}.cute h2{color:#2b4a7a;text-shadow:none}
.cute .btn{border-radius:14px;border:3px solid #2b4a7a;background:#fff;color:#2b4a7a;box-shadow:0 3px 0 #2b4a7a;font-weight:900}
.cute .btn.g{background:#86e3b8}.cute .btn.bl{background:#9ccfff}.cute .btn.y{background:#ffd166}.cute .btn.rd{background:#ff9a9a}.cute .og{background:#ff9a3c!important;box-shadow:0 3px 0 #b85d00!important}
.cute .bar{background:#fff;border:3px solid #2b4a7a;border-radius:12px;overflow:hidden}.cute .bar i{background:repeating-linear-gradient(45deg,#86e3b8 0 10px,#a8f0cf 10px 20px)}
.cute .av{background:#fff3c4;border:3px solid #2b4a7a;border-radius:22px}.cute .mut{color:#6b7a99}.cute .done{border-color:#13986a}
.cute input,.cute select,.cute textarea{background:#fff;color:#2b3a55;border:3px solid #2b4a7a;border-radius:10px}.cute td,.cute th{border:2px solid #2b4a7a}.cute .na{opacity:.45}
</style></head><body><div class="wrap" id="app"></div>

const thr=L=>{const pv=Math.min(59,Math.max(2,S.set.pv||25)),T=S.set.maxXp||8000,b=CUM[pv-1],k=Math.max(.01,(T-b)/(CUM[59]-b));return L<=pv?CUM[L-1]:Math.round(b+(CUM[L-1]-b)*k)};

function ratio(sid,d){const t=tasksFor(d,sid);if(!t.length)return null;return t.filter(k=>ev(sid,k.id,d)).length/t.length}
const clear=(sid,d)=>{const r=ratio(sid,d);return r!==null&&r>=S.set.th/100-1e-9};
function info(sid){const evs=S.events.filter(x=>x.sid===sid),xp=evs.reduce((a,x)=>a+x.xp,0);
 let first=TODAY();[...Object.keys(S.daily),...S.events.map(x=>x.date)].forEach(d=>{if(d<first)first=d});
 let days=0,streak=0,cur=pd(first),end=pd(TODAY()),all=[];
 for(let i=0;cur<=end&&i<800;i++,cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1)){const d=ymd(cur);all.push(d);if(clear(sid,d))days++}
 for(let i=all.length-1;i>=0;i--){const d=all[i];if(ratio(sid,d)===null)continue;if(clear(sid,d))streak++;else if(d!==TODAY())break}
 let best=0,run=0;all.forEach(d=>{if(ratio(sid,d)===null)return;if(clear(sid,d)){run++;best=Math.max(best,run)}else if(d!==TODAY())run=0});
 return{xp,...lvl(xp),best,tasks:evs.filter(x=>x.type==='task').length,bounty:evs.filter(x=>x.type==='bounty').length,days,streak,evs}}
